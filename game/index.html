<!doctype html>
<!-- Day 5 keeps the v1 HUD information and layout while the city population grows. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA PERLA — A coastal crime story</title>
<link rel="icon" href="data:,">
<style>
  /* Coastal case file colors are shared by the mission, pursuit, and driving HUD. */
  :root {
    --skin-paper: #fff2da;
    --skin-night: #251e32;
    --skin-veil: #21152866;
    --skin-case-panel: #211528e8;
    --skin-peach-rule: #ffc59b66;
    --skin-peach: #ffc198;
    --skin-ink: #261824;
    --skin-focus: #ffe05d;
    --skin-case-solid: #211528f2;
    --skin-pause-veil: #211528dc;
    --skin-radio: #f4d992;
    --skin-shadow: #1e1528;
    --skin-mission-panel: #211528b8;
    --skin-star: #ffcf5b;
    --skin-cash: #b8f1be;
    --skin-heat: #ff9c71;
    --skin-message: #ffe1a5;
    --skin-police-text: #ffb3a5;
    --skin-police-panel: #251a2bc9;
    --skin-police-accent: #ff747e;
    --skin-map-tick: #ffffff1a;
    --skin-map-base: #292b46cc;
    --skin-map-inner: #21152835;
    --skin-speed: #ffe0b7;
    --skin-health-label: #f5d6bd;
    --skin-health-fill: #e77869;
    --skin-health-track: #fff2da33;
    --body-face: system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; color: var(--skin-paper); background: var(--skin-night); font: 16px var(--body-face); }
  canvas { display: block; }
  #intro { z-index: 6; position: fixed; inset: 0; display: grid; place-items: center; background: var(--skin-veil); }
  #intro[hidden] { display: none; }
  article { padding: 30px 40px; background: var(--skin-case-panel); border: 1px solid var(--skin-peach-rule); }
  h1 { overflow-wrap: break-word; min-width: 0; margin: 0; font-size: clamp(44px, 8vw, 96px); font-style: italic; letter-spacing: -.06em; line-height: .95; }
  .tag { color: var(--skin-peach); text-transform: uppercase; letter-spacing: .35em; }
  button { font: bold 1rem var(--body-face); padding: 12px 24px; border: 0; background: var(--skin-peach); color: var(--skin-ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #intro nav { display: flex; flex-wrap: wrap; gap: 8px; }
  #screens article { max-height: 90vh; overflow: auto; }
  button:focus-visible { outline: 3px solid var(--skin-focus); outline-offset: 3px; }
  :root { --case: var(--skin-case-solid); --paper: var(--skin-paper); --accent: var(--skin-peach); }
  html, body { overflow-x: clip; }
  #screens { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--skin-pause-veil); color: var(--skin-paper); }
  #screens[hidden] { display: none; }
  #screens article { width: min(520px, calc(100% - 32px)); border-left: 4px solid var(--skin-peach); }
  #screens h2 { margin: 4px 0 12px; overflow-wrap: break-word; }
  #screens p { line-height: 1.5; }
  #screens nav, #dialogue nav { display: flex; flex-wrap: wrap; gap: 8px; }
  #screens button { min-width: 132px; }
  #radio { position: absolute; left: 18px; bottom: 94px; color: var(--skin-radio); font-size: 12px; }
  #dialogue { position: fixed; z-index: 3; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(580px, calc(100% - 32px)); padding: 14px; color: var(--skin-paper); background: var(--skin-case-solid); border-left: 3px solid var(--skin-peach); }
  @keyframes arrive { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  #dialogue:not([hidden]), #screens:not([hidden]) article { animation: arrive 180ms cubic-bezier(.2,0,.2,1); }
  #dialogue[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 18px; text-shadow: 0 2px 5px var(--skin-shadow); font-weight: 700; letter-spacing: .05em; }
  #hud > * { position: absolute; }
  #mission { top: 18px; left: 18px; width: min(360px, 44vw); padding: 10px 14px; border-left: 3px solid var(--skin-peach); background: var(--skin-mission-panel); transition: opacity .5s, transform .5s, padding .5s; }
  #mission.compact { padding-top: 7px; padding-bottom: 7px; }
  #mission.compact small { display: none; }
  #mission.flash { animation: pulse .8s ease-out; }
  #mission small { display: block; color: var(--skin-peach); font-size: 10px; letter-spacing: .2em; }
  #objective { display: block; line-height: 1.35; text-wrap: pretty; font-size: 13px; }
  #status { top: 18px; right: 18px; text-align: right; }
  .stars { color: var(--skin-star); letter-spacing: .08em; font-size: 20px; }
  .cash { color: var(--skin-cash); }
  .heat { color: var(--skin-heat); font-size: 11px; }
  #hud > .action { left: 50%; bottom: 16%; transform: translateX(-50%); max-width: min(520px, 70vw); text-align: center; padding: 4px; }
  .action { color: var(--skin-message); font-size: 10px; }
  #police { display: none; right: 18px; top: 95px; color: var(--skin-police-text); font-size: 11px; padding: 8px 10px; background: var(--skin-police-panel); border-right: 2px solid var(--skin-police-accent); }
  #hud.wanted #police { display: block; }
  #minimap { right: 18px; bottom: 22px; width: 104px; height: 104px; border-radius: 50%; background: repeating-conic-gradient(var(--skin-map-tick) 0 4deg, transparent 4deg 12deg), var(--skin-map-base); box-shadow: inset 0 0 0 18px var(--skin-map-inner); }
  .compass { bottom: 136px; right: 18px; font-size: 10px; color: var(--skin-speed); }
  .speed { bottom: 22px; left: 18px; font-size: 20px; color: var(--skin-speed); }
  .health { bottom: 53px; left: 18px; color: var(--skin-health-label); font-size: 10px; }
  .health i { display: inline-block; width: 116px; height: 5px; background: linear-gradient(90deg, var(--skin-health-fill) 0 var(--health, 100%), var(--skin-health-track) var(--health, 100%)); vertical-align: middle; margin-left: 5px; }
  @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
<section id="intro">
  <article>
    <p class="tag">A coastal crime story</p>
    <h1>LA PERLA</h1>
    <p>WASD drive or walk · Space handbrake · Shift run · E exit or enter · R radio · G garage · Esc pause</p>
    <nav><button type="button" data-action="new">New Game</button><button type="button" data-action="continue">Continue</button><button type="button" data-action="missions">Missions</button></nav>
  </article>
</section>
<div id="hud" aria-label="LA PERLA driving and pursuit HUD">
  <div id="mission"><small id="file">FIELD FILE</small><span id="objective">Reach the boulevard · find a way through</span></div>
  <div id="status"><span class="stars"></span><br><span class="cash">$2,450</span><br><span class="heat"></span><br></div><span class="action"></span>
  <div id="police"><span class="police-status"></span></div>
  <div class="compass">N · OLD TOWN › PORT</div><canvas id="minimap" width="104" height="104" aria-label="Minimap"></canvas><div class="health">HEALTH <i></i></div><div class="speed">0 KM/H</div><div id="radio">SOL 101.9 · LUZ ON AIR</div>
</div>
<section id="screens" hidden aria-live="polite"><article><small>FIELD REPORT</small><h2></h2><p></p><nav></nav></article></section>
<section id="dialogue" hidden aria-live="polite"><strong></strong><p></p><nav></nav></section>
<script type="module" src="./src/main.js"></script>
</html>
