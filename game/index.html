<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA PERLA — A coastal crime story</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #fff2da; background: #251e32; font: 16px system-ui, sans-serif; }
  canvas { display: block; }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; background: #21152866; }
  #intro[hidden] { display: none; }
  article { padding: 30px 40px; background: #211528e8; border: 1px solid #ffc59b66; }
  h1 { margin: 0; font-size: clamp(44px, 8vw, 96px); font-style: italic; letter-spacing: -.06em; line-height: .95; }
  .tag { color: #ffc198; text-transform: uppercase; letter-spacing: .35em; }
  button { font: bold 1rem system-ui; padding: 12px 24px; border: 0; background: #ffc198; color: #261824; cursor: pointer; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 18px; text-shadow: 0 2px 5px #1e1528; font-weight: 700; letter-spacing: .05em; }
  #hud > * { position: absolute; }
  #mission { top: 18px; left: 18px; width: min(360px, 44vw); padding: 10px 14px; border-left: 3px solid #ffc198; background: #211528b8; transition: opacity .5s, transform .5s, padding .5s; }
  #mission.compact { padding-top: 7px; padding-bottom: 7px; }
  #mission.compact small { display: none; }
  #mission.flash { animation: pulse .8s ease-out; }
  #mission small { display: block; color: #ffc198; font-size: 10px; letter-spacing: .2em; }
  #objective { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
  #status { top: 18px; right: 18px; text-align: right; }
  .stars { color: #ffcf5b; letter-spacing: .08em; font-size: 20px; }
  .cash { color: #b8f1be; }
  .heat { color: #ff9c71; font-size: 11px; }
  .action { color: #ffe1a5; font-size: 10px; }
  #police { display: none; right: 18px; top: 95px; color: #ffb3a5; font-size: 11px; padding: 8px 10px; background: #251a2bc9; border-right: 2px solid #ff747e; }
  #hud.wanted #police { display: block; }
  #minimap { right: 18px; bottom: 22px; width: 104px; height: 104px; border-radius: 50%; background: repeating-conic-gradient(#ffffff1a 0 4deg, transparent 4deg 12deg), #292b46cc; box-shadow: inset 0 0 0 18px #21152835; }
  .compass { bottom: 136px; right: 18px; font-size: 10px; color: #ffe0b7; }
  .speed { bottom: 22px; left: 18px; font-size: 20px; color: #ffe0b7; }
  .health { bottom: 53px; left: 18px; color: #f5d6bd; font-size: 10px; }
  .health i { display: inline-block; width: 116px; height: 5px; background: linear-gradient(90deg, #e77869 0 88%, #fff2da33 88%); vertical-align: middle; margin-left: 5px; }
  @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
<section id="intro">
  <article>
    <p class="tag">A coastal crime story</p>
    <h1>LA PERLA</h1>
    <p>WASD drive or walk · Space handbrake · Shift run · E exit or enter</p>
    <button type="button">Drive</button>
  </article>
</section>
<div id="hud" aria-label="LA PERLA driving and pursuit HUD">
  <div id="mission"><small>DAY 2 · THE BOULEVARD</small><span id="objective">Reach the boulevard · find a way through</span></div>
  <div id="status"><span class="stars"></span><br><span class="cash">$2,450</span><br><span class="heat"></span><br><span class="action"></span></div>
  <div id="police"><span class="police-status"></span></div>
  <div class="compass">N · OLD TOWN › PORT</div><canvas id="minimap" width="104" height="104" aria-label="Minimap"></canvas><div class="health">HEALTH <i></i></div><div class="speed">0 KM/H</div>
</div>
<script type="module" src="./src/main.js"></script>
</html>
